<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3B2A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dualar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dualar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="fav-48.png">
<link rel="apple-touch-icon" href="apple-180.png">
<link rel="preload" href="sch.woff2" as="font" type="font/woff2" crossorigin>

<style>@font-face{font-family:"Lit";src:url("lit.woff2") format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"Lit";src:url("lit-i.woff2") format("woff2");font-weight:200 900;font-style:italic;font-display:swap}
@font-face{font-family:"Sch";src:url("sch.woff2") format("woff2");font-display:block}
:root{
 --bg:#F3EEE4; --card:#FFFCF6; --ink:#1F2A28; --muted:#646D6A; --gold:#86602A; --orn:#B08A4A; --acc:#123B39;
 --line:#E3D6BD; --deep:#123B39; --deepink:#F2E6CC; --deepgold:#D9B26A; --deepmuted:#CFC3A6;
 --tab:#FFFCF6; --tabon:#123B39; --hl:#EAEFEC; --tint:#F0E8D6; --btn:#EAF0EC; --btnink:#123B39;
 --fs:1; --fa:1; color-scheme:light;
}
html.dark{
 --bg:#0D1716; --card:#142120; --ink:#ECE5D5; --muted:#A3ADA9; --gold:#D9B26A; --orn:#C9A45C; --acc:#E2C487;
 --line:#26363A; --deep:#0A2221; --deepink:#ECE5D5; --deepgold:#D9B26A; --deepmuted:#B9B29F;
 --tab:#101C1B; --tabon:#E2C487; --hl:#1C2B2A; --tint:#1B2826; --btn:#1C2B2A; --btnink:#E2C487;
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"Lit",Georgia,serif;font-size:calc(18px*var(--fs));line-height:1.5;min-height:100vh;
 padding-top:calc(60px + env(safe-area-inset-top));padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
a{color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pat{background-color:var(--deep);background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2244%22%20height%3D%2244%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cpolygon%20points%3D%2250.00%2C4.00%2063.47%2C17.47%2082.53%2C17.47%2082.53%2C36.53%2096.00%2C50.00%2082.53%2C63.47%2082.53%2C82.53%2063.47%2C82.53%2050.00%2C96.00%2036.53%2C82.53%2017.47%2C82.53%2017.47%2C63.47%204.00%2C50.00%2017.47%2C36.53%2017.47%2C17.47%2036.53%2C17.47%22%20fill%3D%22none%22%20stroke%3D%22%23D9B26A%22%20stroke-opacity%3D%22.16%22%20stroke-width%3D%222.2%22/%3E%3Cpolygon%20points%3D%2250.00%2C30.00%2055.86%2C35.86%2064.14%2C35.86%2064.14%2C44.14%2070.00%2C50.00%2064.14%2C55.86%2064.14%2C64.14%2055.86%2C64.14%2050.00%2C70.00%2044.14%2C64.14%2035.86%2C64.14%2035.86%2C55.86%2030.00%2C50.00%2035.86%2C44.14%2035.86%2C35.86%2044.14%2C35.86%22%20fill%3D%22none%22%20stroke%3D%22%23D9B26A%22%20stroke-opacity%3D%22.16%22%20stroke-width%3D%222.2%22/%3E%3C/svg%3E");background-size:44px 44px}

/* Üst çubuk */
#bar{position:fixed;top:0;left:0;right:0;z-index:5;color:var(--deepink);
 padding:env(safe-area-inset-top) 4px 0;height:calc(60px + env(safe-area-inset-top));display:flex;align-items:center;gap:2px}
#title{flex:1;background:none;border:0;height:56px;cursor:pointer;font-family:inherit;padding:0 4px;min-width:0;text-align:center;font-size:18px;font-weight:600;letter-spacing:.02em;line-height:1.15;overflow:hidden;color:var(--deepgold);transition:opacity .2s}
#title.long{font-size:15.5px}
#title.dim{opacity:0}
#title span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iconbtn{background:none;border:0;display:flex;align-items:center;justify-content:center;gap:4px;
 min-width:60px;height:52px;padding:0 10px;border-radius:12px;cursor:pointer;color:var(--deepgold);font-size:16px}
.iconbtn svg{width:24px;height:24px}
.iconbtn:active{background:rgba(255,255,255,.10)}
#settings span{display:none}
#back.hide,#settings.hide{visibility:hidden}

/* Sayfa başı (koyu bant) */
.hero{margin:-16px -12px 18px;padding:6px 22px 22px;color:var(--deepink)}
.hero .k{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--deepgold);margin-bottom:2px}
.hero h1{margin:0;font-size:calc(28px*min(var(--fs),1.15));line-height:1.15;font-weight:500;letter-spacing:.005em}
.hero .s{font-style:italic;color:var(--deepmuted);font-size:calc(15.5px*min(var(--fs),1.15));margin-top:6px}

/* Alt sekmeler */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--tab);border-top:1px solid var(--line);
 display:flex;padding-bottom:env(safe-area-inset-bottom)}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:72px;
 text-decoration:none;color:var(--muted);font-size:13.5px;letter-spacing:.01em}
#tabs a svg{width:27px;height:27px;stroke-width:1.6}
#tabs a.on{color:var(--tabon);font-weight:600}
#tabs a.on svg{stroke-width:2.1}

main{max-width:640px;margin:0 auto;padding:16px 12px 24px}

/* Listeler */
.h2{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:22px 6px 10px;scroll-margin-top:calc(70px + env(safe-area-inset-top))}
.h2:first-child{margin-top:4px}
.now-pill{letter-spacing:.04em;text-transform:none;font-size:12.5px;background:var(--deep);color:var(--deepink);border-radius:999px;padding:3px 11px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp.cur .list{border:1.5px solid var(--acc);box-shadow:0 4px 16px rgba(18,59,57,.10)}
.row{display:flex;align-items:center;gap:13px;min-height:62px;padding:12px 15px;text-decoration:none;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--hl)}
.row .ic{flex:none;display:flex;color:var(--orn)}
.row .ic svg{width:20px;height:20px;stroke-width:3.6}
.row .t{flex:1;font-size:calc(18.5px*var(--fs));line-height:1.28}
.row .s{display:block;font-size:calc(15px*var(--fs));color:var(--muted);margin-top:2px;font-style:italic}
.chev{width:19px;height:19px;color:var(--orn);flex:none}
.secintro{font-style:italic;color:var(--muted);font-size:calc(15.5px*var(--fs));margin:-4px 6px 10px}

/* Dua */
.dua{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 12px 12px;margin-bottom:16px;scroll-margin-top:80px;box-shadow:0 4px 14px rgba(18,59,57,.06)}
.dua .note{font-style:italic;color:var(--gold);text-align:center;font-size:calc(16.5px*var(--fs));line-height:1.45;margin:0 4px 10px;text-wrap:balance}
.dua .dt{text-align:center;color:var(--acc);font-weight:600;margin-bottom:6px}
.arb{text-align:center;direction:rtl;margin:0 -6px}
.ar{font-family:"Sch",serif;font-size:calc(29px*var(--fa,1));line-height:1.9;white-space:nowrap;unicode-bidi:isolate}
.nk{font-size:72%;position:relative;top:.42em;margin:0 .05em 0 -.15em}
.rule{width:48px;height:2px;border-radius:2px;background:var(--orn);margin:8px auto 12px}
.meal{text-align:center}
.tr{font-size:calc(17px*var(--fs));line-height:1.34;margin-bottom:.34em;text-wrap:balance}
.tr .g{white-space:nowrap}
html.nobrk .tr{white-space:nowrap}
html.nobrk .tr.brk{white-space:normal}
.tr:last-child{margin-bottom:0}
.src{text-align:center;font-style:italic;color:var(--muted);font-size:calc(14.5px*var(--fs));margin-top:10px;text-wrap:balance}
.acts{display:flex;gap:10px;margin-top:14px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;background:var(--btn);border-radius:13px;
 font-size:16px;color:var(--btnink);cursor:pointer}
.act svg{width:24px;height:24px}
.act:active{filter:brightness(.95)}
.act.on{color:var(--btnink);font-weight:600}
.act.on svg{fill:currentColor}
.xref{display:flex;gap:12px;align-items:center;background:var(--tint);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;text-decoration:none;min-height:64px}
.xref .t{flex:1;font-size:calc(18px*var(--fs))}
.xref .s{display:block;font-style:italic;color:var(--muted);font-size:calc(15px*var(--fs))}
.pn{display:flex;gap:10px;margin-top:8px}
.pn a{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:72px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;
 text-decoration:none;background:var(--card)}
.pn a.n{text-align:right}
.pn small{font-size:12px;color:var(--gold);letter-spacing:.16em;text-transform:uppercase}
.pn span{font-size:calc(17px*var(--fs));line-height:1.25}
.pn a.empty{visibility:hidden}
.alllink{display:block;text-align:center;padding:16px;font-size:16.5px;color:var(--acc);font-weight:600}

/* Arama */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;height:60px;border-radius:16px;border:1.5px solid var(--orn);background:var(--card);color:var(--ink);
 font:inherit;font-size:20px;padding:0 52px 0 18px;outline:none}
.search input:focus{border-width:2px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search button{position:absolute;right:6px;top:6px;width:48px;height:48px;border:0;background:none;color:var(--muted);border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:calc(17px*var(--fs));cursor:pointer}
.empty-msg{text-align:center;color:var(--muted);font-style:italic;padding:24px 12px;font-size:calc(17px*var(--fs))}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}

/* Ayarlar */
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.set .lab{font-size:16.5px;font-weight:600;margin-bottom:10px;color:var(--acc)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:56px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;cursor:pointer;font-size:17px}
.seg button.on{border-color:var(--acc);color:var(--acc);font-weight:600;background:var(--hl)}
.preview{margin-top:12px;text-align:center}
.about p{font-size:calc(16px*var(--fs));line-height:1.55;color:var(--muted)}
.star{display:block;width:64px;height:64px;margin:6px auto 4px;color:var(--orn)}
.star polygon{stroke-width:1.6}

/* Paylaşım seçimi */
.sheet-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .lab{text-align:center;font-weight:600;margin-bottom:12px}
.sheet button{display:block;width:100%;min-height:60px;margin-top:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:19px;cursor:pointer}
.sheet button.cancel{border:0;background:none;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);color:var(--deepink);
 padding:12px 20px;border-radius:12px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}

/* Sıralama */
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 2px 12px}
.sortbar span{font-size:14px;color:var(--muted);font-style:italic}
.sbtn{min-height:48px;min-width:48px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:16px;cursor:pointer}
.sbtn:active{background:var(--hl)}
.sbtn:disabled{opacity:.35}
.sbtn.done{border-color:var(--acc);color:var(--acc);font-weight:600}
.sbtn.sort{background:var(--btn);border-color:transparent;color:var(--btnink)}
.sbtn.reset{display:block;width:100%;margin-top:12px}
.srow{padding:12px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .st b{display:block;font-weight:600;font-size:calc(17px*var(--fs));line-height:1.3}
.srow .st span{display:block;font-size:calc(14.5px*var(--fs));color:var(--muted);font-style:italic;margin-top:2px}
.sbtns{display:flex;gap:8px;margin-top:10px}
.sbtns .sbtn:first-child{flex:1}
.twin{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;padding:14px 16px;border:1.5px dashed var(--orn);border-radius:16px;text-decoration:none;color:var(--acc);font-weight:600;font-size:calc(16px*var(--fs))}
.favlab{display:flex;align-items:center;gap:6px;margin:0 6px 8px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-decoration:none}
.favlab .chev{width:15px;height:15px}
</style>
</head>

<script>const VER="7d49f37d";(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const DUA = DATA.duas, SECS = DATA.secs;
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- yapı ---------- */
const SUB = {}, SUBS = [], DUA_SUB = {};
SECS.forEach(sec => sec.subs.forEach(s => {
  s.sec = sec; SUB[s.id] = s; SUBS.push(s);
  s.i.forEach(it => { if (it.d) DUA_SUB[it.d] = s; });
}));
const duaCount = s => s.i.filter(x => x.d).length;
const slug = id => id.replace(/_/g, '-');
const UNSLUG = {}; Object.keys(DUA).forEach(id => UNSLUG[slug(id)] = id);
let pendingFocus = null;

/* ---------- ayarlar ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('dualar.'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('dualar.'+k, JSON.stringify(v)); }catch(e){} }
};
const FS = [0.88, 1, 1.18, 1.35];
const FA = [0.9, 1, 1.07, 1.14];
const FS_L = ['Küçük', 'Normal', 'Büyük', 'Çok büyük'];
let fav = store.get('fav', []);
function applySettings(){
  const fi = store.get('fs', 1);
  document.documentElement.style.setProperty('--fs', FS[fi] || 1);
  document.documentElement.style.setProperty('--fa', FA[fi] || 1);
  document.documentElement.classList.toggle('nobrk', fi <= 1);
  const th = store.get('theme', 'auto');
  const dark = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  document.querySelector('meta[name=theme-color]').content = dark ? '#0F0B08' : '#3B2A1A';
}
(function(){ const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applySettings); else if (mq.addListener) mq.addListener(applySettings); })();
applySettings();

/* ---------- ekranı açık tutma ---------- */
let lock = null, wantLock = false;
async function setLock(on){
  wantLock = on && store.get('awake', true);
  if (!('wakeLock' in navigator)) return;
  try{
    if (wantLock && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); }
    else if (!wantLock && lock){ await lock.release(); lock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantLock) setLock(true); });

/* ---------- simgeler ---------- */
const IC = {
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const hero = (k, t, s) => '<div class="hero pat">' + (k ? '<div class="k">' + esc(k) + '</div>' : '') + '<h1>' + esc(t) + '</h1>' + (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>';
function star8(){
  const pts = R => { const a = []; for (let i = 0; i < 16; i++){ const q = i % 2 ? R * .7654 : R, t = (i * 22.5 - 90) * Math.PI / 180; a.push((50 + q * Math.cos(t)).toFixed(1) + ',' + (50 + q * Math.sin(t)).toFixed(1)); } return a.join(' '); };
  return '<svg class="star" viewBox="0 0 100 100">' + [46, 32, 12.5].map(R => '<polygon points="' + pts(R) + '"/>').join('') + '</svg>';
}
IC.st = star8().replace(' class="star"', '');

/* ---------- dua kartı ---------- */
function arLine(l){
  const nk = new Set(l.nk);
  return l.t.split(' ').map((w, i) => esc(w) + (nk.has(i) ? '<span class="nk">نِ</span>' : '')).join(' ');
}
function duaHTML(id){
  const d = DUA[id], on = fav.includes(id);
  return '<article class="dua" id="c-' + slug(id) + '">' +
    (d.ti ? '<div class="dt">' + esc(d.ti) + '</div>' : '') +
    (d.n ? '<div class="note">' + esc(d.n) + '</div>' : '') +
    '<div class="arb" lang="ar" dir="rtl">' + d.ar.map(l => '<div class="ar">' + arLine(l) + '</div>').join('') + '</div>' +
    '<div class="rule"></div>' +
    '<div class="meal">' + d.tr.map(t => '<div class="tr">' + t.map(g => '<span class="g">' + esc(g.replace(/-/g, '\u2011')) + '</span>').join(' ') + '</div>').join('') + '</div>' +
    '<div class="src">(' + esc(d.s) + ')</div>' +
    '<div class="acts">' +
      '<button class="act fav' + (on ? ' on' : '') + '" data-id="' + id + '" aria-pressed="' + on + '">' + IC.star + '<span>' + (on ? 'Favoride' : 'Favori') + '</span></button>' +
      '<button class="act shr" data-id="' + id + '">' + IC.share + '<span>Paylaş</span></button>' +
    '</div></article>';
}
function fitTr(){
  const nobrk = document.documentElement.classList.contains('nobrk');
  document.querySelectorAll('.meal').forEach(m => {
    const trs = m.querySelectorAll('.tr');
    trs.forEach(t => t.style.fontSize = '');
    const W = m.clientWidth; if (!W) return;
    if (nobrk){
      trs.forEach(t => {
        t.classList.remove('brk');
        if (t.scrollWidth <= W) return;
        const k = W / t.scrollWidth;
        // %90'dan fazla küçülecekse yalnızca belirlenmiş yerlerden böl
        if (k < .9 && t.querySelectorAll('.g').length > 1){
          t.classList.add('brk');
          let mx = 0; t.querySelectorAll('.g').forEach(g => { mx = Math.max(mx, g.getBoundingClientRect().width); });
          if (mx > W){ const f = parseFloat(getComputedStyle(t).fontSize); t.style.fontSize = f * W / mx * .98 + 'px'; }
          return;
        }
        const f = parseFloat(getComputedStyle(t).fontSize); t.style.fontSize = f * k * .98 + 'px';
      });
    } else {
      trs.forEach(t => {
        let mx = 0; t.querySelectorAll('.g').forEach(g => { mx = Math.max(mx, g.getBoundingClientRect().width); });
        if (mx > W){ const f = parseFloat(getComputedStyle(t).fontSize); t.style.fontSize = f * W / mx * .98 + 'px'; }
      });
    }
  });
}
function fitAr(){
  fitTr();
  document.querySelectorAll('.ar').forEach(el => {
    el.style.fontSize = '';
    const w = el.parentNode.clientWidth;
    if (el.scrollWidth > w){
      const f = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(f * w / el.scrollWidth * .98, f * .4) + 'px';
    }
  });
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fitAr, 120); });

/* ---------- ekranlar ---------- */
function rowSub(s, extra){
  return '<a class="row" href="#konu-' + s.id + '"><span class="ic">' + IC.st + '</span><span class="t">' + esc(s.t) + (extra ? '<span class="s">' + esc(extra) + '</span>' : '') + '</span>' + IC.chev + '</a>';
}
// Günün akışı vakit grupları (başlık adıyla; sıra değişse de bozulmaz). from/to: saat aralığı
const VAKIT = [
  {ad: 'Sabah', from: 4, to: 11, subs: ['Uyanınca', 'Sabah ve Akşam', 'Evden Çıkarken', 'Vasıtaya Binerken']},
  {ad: 'Gün İçinde', from: 11, to: 17, subs: ['Ezan Okununca', 'Namazdan Sonra', 'Yemekte', 'Tuvalete Girerken ve Çıkarken']},
  {ad: 'Akşam', from: 17, to: 21, subs: ['Sabah ve Akşam', 'Oruç Açarken']},
  {ad: 'Gece', from: 21, to: 28, subs: ['Yatarken', 'Gece Uyanınca', 'Kadir Gecesinde']},
  {ad: 'Her Zaman', subs: ['Sıkıntılı Anlarda', 'Hasta Ziyaretinde']}
];
let akisGosterildi = false;
function pBugun(){
  let h = new Date().getHours(); if (h < 4) h += 24;
  const ci = VAKIT.findIndex(v => v.from != null && h >= v.from && h < v.to);
  const b1 = SECS[0];
  const ilk = !akisGosterildi; akisGosterildi = true;
  return {
    title: 'Günün Akışı', tab: 'bugun', root: true, focus: ilk && ci > 0 ? 'vakit-' + ci : null,
    html: hero('', 'Günün Akışı', 'Günün vakitlerine göre dualar') +
      VAKIT.map((v, i) => '<div class="grp' + (i === ci ? ' cur' : '') + '"><div class="h2" id="vakit-' + i + '">' + esc(v.ad) + (i === ci ? '<span class="now-pill">Şimdi</span>' : '') + '</div><div class="list">' +
        v.subs.map(t => b1.subs.find(x => x.t === t)).filter(Boolean).map(x => rowSub(x)).join('') + '</div></div>').join('')
  };
}
function pDualar(){
  return {
    title: 'Konulara Göre', tab: 'dualar', root: true,
    html: hero('', 'Konulara Göre Dualar', 'Resulullah’ın dilinden ve Kur’an-ı Kerim’den') +
      SECS.slice(1).map(sec => '<div class="h2">' + esc(sec.t) + '</div><p class="secintro">' + esc(sec.in) + '</p><div class="list">' +
      sec.subs.map(s => rowSub(s)).join('') + '</div>').join('')
  };
}
/* Kullanıcının belirlediği sıra (başlık başına, telefonda saklanır) */
const itemKey = it => it.x ? 'x:' + it.x : it.d;
function orderedItems(s){
  const saved = store.get('sira.' + s.id, null);
  if (!Array.isArray(saved)) return s.i.slice();
  const byKey = {}; s.i.forEach(it => byKey[itemKey(it)] = it);
  const out = saved.filter(k => byKey[k]).map(k => byKey[k]);
  s.i.forEach(it => { if (!out.includes(it)) out.push(it); });
  return out;
}
// Sıralama listesinde duayı tanıtan satır: "Allah'ım!", "Rabbim!" gibi hitapları atlayıp ilk anlamlı satır
const HITAP = /^(ey\s+)?(allah[’']?[ıi]m|rabbim(iz)?)[!,.]?$/i;
function itemTitle(it){
  if (it.x) return it.l;
  const d = DUA[it.d]; if (d.ti) return d.ti;
  const t = d.tr.map(x => x.join(' ')).filter(l => !HITAP.test(l.trim()));
  return t[0] || d.tr[0].join(' ');
}
function itemSub(it){
  return it.x ? DUA[it.x].s : DUA[it.d].s;
}
function xrefHTML(it){
  const t = DUA_SUB[it.x];
  return '<a class="xref" href="#dua-' + slug(it.x) + '"><span class="t">' + esc(it.l) + '<span class="s">' + esc(DUA[it.x].s) + (t ? ' · ' + esc(t.sec.sh) + ', ' + esc(t.t) : '') + '</span></span>' + IC.chev + '</a>';
}
let sortMode = null;
function pKonu(id){
  const focus = pendingFocus; pendingFocus = null;
  const s = SUB[id]; if (!s) return null;
  const i = SUBS.indexOf(s), pv = SUBS[i - 1], nx = SUBS[i + 1];
  const pn = (x, cls, lab) => x ? '<a class="' + cls + '" href="#konu-' + x.id + '"><small>' + lab + '</small><span>' + esc(x.t) + '</span></a>' : '<a class="' + cls + ' empty"></a>';
  const items = orderedItems(s);
  const sorting = sortMode === s.id;
  const custom = Array.isArray(store.get('sira.' + s.id, null));
  // Diğer konu bölümünde aynı adlı başlık
  const twin = s.sec.id !== 'b1' && SUBS.find(x => x !== s && x.sec.id !== 'b1' && x.sec.id !== s.sec.id && x.t === s.t);
  let body;
  if (sorting){
    body = '<div class="sortbar"><span>Sırayı değiştirin</span><button class="sbtn done" data-a="bitti">Bitti</button></div><div class="list sortlist">' +
      items.map((it, k) => '<div class="srow" data-k="' + esc(itemKey(it)) + '"><div class="st"><b>' + esc(itemTitle(it)) + '</b><span>' + esc(itemSub(it)) + '</span></div>' +
        '<div class="sbtns"><button class="sbtn" data-a="ilk" ' + (k ? '' : 'disabled') + '>Başa al</button>' +
        '<button class="sbtn" data-a="yukari" aria-label="Yukarı" ' + (k ? '' : 'disabled') + '>▲</button>' +
        '<button class="sbtn" data-a="asagi" aria-label="Aşağı" ' + (k < items.length - 1 ? '' : 'disabled') + '>▼</button></div></div>').join('') + '</div>' +
      (custom ? '<button class="sbtn reset" data-a="sifirla">İlk sıraya dön</button>' : '');
  } else {
    body = items.map(it => it.x ? xrefHTML(it) : duaHTML(it.d)).join('');

/* ---------- arama ---------- */
const NMAP = {'â':'a','î':'i','û':'u','ı':'i','ş':'s','ğ':'g','ç':'c','ö':'o','ü':'u','ê':'e','ô':'o'};
function norm(s){
  s = s.toLocaleLowerCase('tr');
  let o = '';
  for (const ch of s){
    if (NMAP[ch]) o += NMAP[ch];
    else if (/[a-z0-9]/.test(ch)) o += ch;
    else if (/\p{L}/u.test(ch)) o += ch.normalize('NFD')[0];
    else o += ' ';
  }
  return o;
}
const low = s => s.toLocaleLowerCase('tr').replace(/[âàá]/g, 'a').replace(/[îì]/g, 'i').replace(/[ûù]/g, 'u').replace(/[^0-9a-zçğıöşüi]+/g, ' ');
const IDX = Object.keys(DUA).map(id => {
  const d = DUA[id], s = DUA_SUB[id];
  const trl = d.tr.map(t => t.join(' '));
  const sx = SUBS.filter(x => x.i.some(it => it.x === id)).map(x => x.t + ' ' + x.i.find(it => it.x === id).l).join(' ');
  const a = trl.join(' ') + ' ' + d.n + ' ' + d.ti, b = (s ? s.t + ' ' + s.sec.t : '') + ' ' + d.s + ' ' + sx;
  return {id, lines: trl, n: norm(a), meta: norm(b), ln: low(a), lm: low(b)};
});
function search(q){
  // Önce Türkçe harfleri ayırarak ara (şifa ≠ sıfat); sonuç yoksa harfleri sadeleştirerek ara (sifa → şifa)
  const run = (ws, kn, km) => {
    const res = [];
    IDX.forEach(r => {
      const N = ' ' + r[kn], Mt = ' ' + r[km];
      if (!ws.every(w => N.includes(' ' + w) || Mt.includes(' ' + w) || r[kn].includes(w))) return;
      const score = ws.reduce((a, w) => a + (Mt.includes(' ' + w) ? 4 : 0) + (N.includes(' ' + w) ? 2 : 0) + (r[kn].includes(w) ? 1 : 0), 0);
      res.push({r, score});
    });
    return res.sort((a, b) => b.score - a.score).map(x => x.r);
  };
  const w1 = low(q).split(/\s+/).filter(w => w.length > 1);
  if (!w1.length) return [];
  const r1 = run(w1, 'ln', 'lm');
  return r1.length ? r1 : run(norm(q).split(/\s+/).filter(w => w.length > 1), 'n', 'meta');
}
function hl(line, ws){
  const n = line.toLocaleLowerCase('tr').length === line.length ? norm(line) : null;
  if (!n) return esc(line);
  const marks = new Array(line.length).fill(false);
  ws.forEach(w => { let i = n.indexOf(w); while (i >= 0){ for (let k = i; k < i + w.length; k++) marks[k] = true; i = n.indexOf(w, i + 1); } });
  let o = '', on = false;
  [...line].forEach((ch, i) => { if (marks[i] !== on){ o += marks[i] ? '<mark>' : '</mark>'; on = marks[i]; } o += esc(ch); });
  return o + (on ? '</mark>' : '');
}
const CHIPS = ['bağışlanma', 'şifa', 'borç', 'anne baba', 'ilim', 'rızık', 'sabah', 'sıkıntı', 'yatarken', 'cennet', 'cehennem', 'hidayet'];

function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

function wrap(ctx, text, max){
  const ws = text.split(' '), out = []; let cur = '';
  ws.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > max && cur){ out.push(cur); cur = w; } else cur = t; });
  if (cur) out.push(cur); return out;
}
function bwrap(ctx, text, max){
  // Dengeli bölme: satır sayısı aynı kalacak en dar genişliği bul (uygulamadaki text-wrap:balance gibi)
  const n = wrap(ctx, text, max).length;
  if (n <= 1) return [text];
  let lo = max / n, hi = max;
  for (let i = 0; i < 18; i++){ const m = (lo + hi) / 2; if (wrap(ctx, text, m).length > n) lo = m; else hi = m; }
  return wrap(ctx, text, hi);
}
function arPieces(l){
  const nk = new Set(l.nk), ws = l.t.split(' '), out = []; let cur = '';
  ws.forEach((w, i) => { cur += (i && cur === '' ? ' ' : (i ? ' ' : '')) + w; if (nk.has(i)){ out.push([cur, false]); out.push(['نِ', true]); cur = ''; } });
  if (cur) out.push([cur, false]);
  return out;
}
async function makeImage(id){
  const d = DUA[id], W = 1080, P = 90, max = W - 2 * P;
  await Promise.all([document.fonts.load('60px Sch'), document.fonts.load('40px Lit'), document.fonts.load('italic 34px Lit'), document.fonts.load('600 38px Lit')]);
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const plan = [];
  let y = 150;
  if (d.ti){ ctx.font = '600 38px Lit'; bwrap(ctx, d.ti, max).forEach(l => { plan.push(['h', l, y]); y += 50; }); y += 6; }
  ctx.font = 'italic 34px Lit';
  if (d.n){ bwrap(ctx, d.n, max).forEach(l => { plan.push(['n', l, y]); y += 48; }); y += 24; }
  d.ar.forEach(l => { y += 104; plan.push(['a', l, y]); });
  y += 40; plan.push(['r', '', y]); y += 40;
  ctx.font = '40px Lit';
  d.tr.forEach(t => {
    const full = t.join(' ');
    if (ctx.measureText(full).width * .9 <= max){ y += 58; plan.push(['t', full, y]); return; }
    // sığmazsa yalnızca belirlenmiş yerlerden böl
    let cur = '';
    t.forEach(g => { const tt = cur ? cur + ' ' + g : g; if (cur && ctx.measureText(tt).width > max){ y += 58; plan.push(['t', cur, y]); cur = g; } else cur = tt; });
    if (cur){ y += 58; plan.push(['t', cur, y]); }
  });
  y += 30;
  ctx.font = 'italic 30px Lit';
  bwrap(ctx, '(' + d.s + ')', max).forEach(l => { y += 44; plan.push(['s', l, y]); });
  y += 110;
  c.width = W; c.height = y;
  ctx.fillStyle = '#FBF6EC'; ctx.fillRect(0, 0, W, y);
  ctx.strokeStyle = '#D9C9AD'; ctx.lineWidth = 3; ctx.strokeRect(30, 30, W - 60, y - 60);
  const st = (cx, cy, R) => { ctx.beginPath(); for (let i = 0; i < 16; i++){ const q = i % 2 ? R * .7654 : R, t = (i * 22.5 - 90) * Math.PI / 180; ctx[i ? 'lineTo' : 'moveTo'](cx + q * Math.cos(t), cy + q * Math.sin(t)); } ctx.closePath(); ctx.stroke(); };
  ctx.strokeStyle = '#9A6B2F'; ctx.lineWidth = 2.5; st(W / 2, 80, 26); st(W / 2, 80, 18); st(W / 2, 80, 7);
  ctx.textBaseline = 'alphabetic';
  const fit = (t, font, size) => { ctx.font = size + 'px ' + font; const w = ctx.measureText(t).width; if (w > max){ ctx.font = (size * max / w) + 'px ' + font; } };
  plan.forEach(([k, t, yy]) => {
    ctx.textAlign = 'center'; ctx.direction = 'ltr';
    if (k === 'h'){ ctx.font = '600 38px Lit'; ctx.fillStyle = '#8A2E2E'; ctx.fillText(t, W / 2, yy); }
    else if (k === 'n'){ ctx.font = 'italic 34px Lit'; ctx.fillStyle = '#8E6328'; ctx.fillText(t, W / 2, yy); }
    else if (k === 'a'){
      ctx.fillStyle = '#2A211A'; ctx.direction = 'rtl'; ctx.textAlign = 'right';
      const ps = arPieces(t); let f = 60;
      const tw = sz => ps.reduce((a, [x, sm]) => { ctx.font = (sm ? sz * .72 : sz) + 'px Sch'; return a + ctx.measureText(x).width - (sm ? sz * .1 : 0); }, 0);
      let w = tw(f); if (w > max){ f = f * max / w; w = tw(f); }
      let x = W / 2 + w / 2;
      ps.forEach(([x0, sm]) => {
        ctx.font = (sm ? f * .72 : f) + 'px Sch';
        if (sm) x += f * .1;
        ctx.fillText(x0, x, yy + (sm ? f * .3 : 0));
        x -= ctx.measureText(x0).width;
      });
    }
    else if (k === 'r'){ ctx.strokeStyle = '#9A6B2F'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W / 2 - 50, yy); ctx.lineTo(W / 2 + 50, yy); ctx.stroke(); }
    else if (k === 't'){ fit(t, 'Lit', 40); ctx.fillStyle = '#2A211A'; ctx.fillText(t, W / 2, yy); }
    else if (k === 's'){ ctx.font = 'italic 30px Lit'; ctx.fillStyle = '#6B5F55'; ctx.fillText(t, W / 2, yy); }
  });
  return new Promise(r => c.toBlob(r, 'image/png'));
}

  if (h.startsWith('dua-')){ const s = DUA_SUB[UNSLUG[h.slice(4)]]; return s ? '#konu-' + s.id : '#bugun'; }

}
let cur = null;
function render(same){

  if (same === true){}
  else if (stack.length > 1 && stack[stack.length - 2] === h){ stack.pop(); isBack = true; }
  else if (stack[stack.length - 1] !== h) stack.push(h);
  if (stack.length > 60) stack = stack.slice(-60);

  const pg = route();

  document.title = pg.title === 'Dualar' ? 'Dualar' : pg.title + ' · Dualar';

  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// Ana ekrana eklenmiş uygulamada kayıtların (favoriler, ayarlar, dualar) silinmemesini iste
if ((matchMedia('(display-mode: standalone)').matches || navigator.standalone) && navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(() => {});
}
})();
