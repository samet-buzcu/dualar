<!DOCTYPE html>
<html lang="tr">
<head>
<!-- Bazı simgeler: Hugeicons (MIT, © Hugeicons) ve Microsoft Fluent Emoji (MIT, © Microsoft Corporation). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dualar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dualar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="fav-48.png">
<link rel="apple-touch-icon" href="apple-180.png">
<link rel="preload" href="sch.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="lit.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Lit";src:url("lit.woff2") format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"Lit";src:url("lit-i.woff2") format("woff2");font-weight:200 900;font-style:italic;font-display:swap}
@font-face{font-family:"Sch";src:url("sch.woff2") format("woff2");font-display:block}
:root{
 --paper:#F6F2EA; --surf:#FFFDF9; --ink:#17201F; --ink2:#56605E; --ink3:#6B655A; --hair:rgba(23,32,31,.11);
 --green:#143E3B; --green2:#1E5450; --gold:#B48A45; --goldink:#7E5F28; --pill:#E2EAE6; --field:#EAE4D7;
 --opt:#F1ECE1; --mark:#F1E1B9; --onbtn:#F6EEDC; --chev:#A89E8A; --track:#DDD4C2; --barbg:rgba(246,242,234,.9);
 --fs:1; --fa:1; color-scheme:light;
}
html.dark{
 --paper:#0E1514; --surf:#151E1D; --ink:#EDE6D6; --ink2:#A9B1AD; --ink3:#8E968F; --hair:rgba(237,230,214,.13);
 --green:#E3C68B; --green2:#D9BB7E; --gold:#C9A45C; --goldink:#D2B474; --pill:#25332F; --field:#1C2726;
 --opt:#1C2726; --mark:#5A4A22; --onbtn:#0E1514; --chev:#4E5A57; --track:#33403E; --barbg:rgba(14,21,20,.9);
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"Lit",Georgia,serif;font-variation-settings:"opsz" 12;font-size:calc(18px*var(--fs));line-height:1.5;min-height:100vh;
 -webkit-font-smoothing:antialiased;padding-top:calc(56px + env(safe-area-inset-top));padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;font-variation-settings:inherit}
a{color:inherit;text-decoration:none}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:0 0 24px}

/* Üst çubuk: sayfa üstünde şeffaf, kaydırınca zemin rengi alır */
#bar{position:fixed;top:0;left:0;right:0;z-index:5;padding:env(safe-area-inset-top) 6px 0;height:calc(56px + env(safe-area-inset-top));
 display:flex;align-items:center;gap:4px;color:var(--green);transition:background .2s,box-shadow .2s}
#bar.solid{background:var(--barbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 .5px 0 var(--hair)}
#bar.light:not(.solid){color:#F3E9D2}
#bar.dark:not(.solid){color:#3A2618}
.side{flex:1 1 auto;display:flex;align-items:center;min-width:0}
.side.r{flex:0 0 auto;justify-content:flex-end}
#title{position:absolute;left:50%;transform:translateX(-50%);bottom:2px;max-width:50%;background:none;border:0;height:52px;padding:0 4px;cursor:pointer;font-size:16.5px;font-weight:600;font-variation-settings:"opsz" 18;
 color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
#bar.solid #title{opacity:1}
.nb{display:flex;align-items:center;gap:2px;height:48px;min-width:48px;padding:0 10px;border:0;background:none;border-radius:24px;cursor:pointer;
 font-size:17px;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb svg{width:24px;height:24px;flex:none}
.nb.icon{justify-content:center;padding:0}
.nb:active{background:var(--hair)}
.nb.fill{height:38px;background:var(--green);color:var(--onbtn);font-weight:600;padding:0 18px;margin-right:4px}
.nb span{overflow:hidden;text-overflow:ellipsis;max-width:62vw}
#bar.solid #back span{display:none}

/* Büyük başlık */
.kick{padding:4px 22px 0;font-size:calc(14px*min(var(--fs),1.15));color:var(--goldink);font-style:italic}
.lt{margin:0;padding:2px 22px 16px;font-size:calc(34px*min(var(--fs),1.12));line-height:1.1;font-weight:500;font-variation-settings:"opsz" 72;letter-spacing:-.012em}
.lt.sm{font-size:calc(29px*min(var(--fs),1.12))}
.lead{padding:0 22px 16px;margin:-6px 0 0;font-size:calc(15.5px*var(--fs));color:var(--ink2);line-height:1.45}

/* Günün Akışı: vakit kartı */
.hero{position:relative;margin:0 16px 6px;height:196px;border-radius:20px;overflow:hidden;box-shadow:0 0 0 .5px var(--hair)}
.hero svg.sky{position:absolute;left:0;top:0;width:100%;height:100%}
.hero .in{position:absolute;left:18px;bottom:18px;right:38%}
.hero .d{font-size:14px;font-style:italic}
.hero h1{margin:0 0 12px;font-size:calc(34px*min(var(--fs),1.1));line-height:1.08;font-weight:500;font-variation-settings:"opsz" 72;letter-spacing:-.015em}
.go{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px 0 14px;border-radius:23px;font-size:calc(16px*min(var(--fs),1.15));font-weight:600;white-space:nowrap}
.go svg{width:14px;height:14px;stroke-width:2;fill:currentColor}
/* Liste grupları */
.gh{display:flex;align-items:baseline;gap:8px;padding:0 22px 8px;margin-top:22px;font-size:calc(16px*min(var(--fs),1.15));font-weight:600;color:var(--ink)}
.gh small{font-weight:400;font-size:14px;color:var(--ink3);font-style:italic}
.lbl{padding:0 22px 8px;font-size:calc(14px*min(var(--fs),1.15));color:var(--ink2)}
.group{margin:0 16px 22px;background:var(--surf);border-radius:18px;box-shadow:0 0 0 .5px var(--hair),0 1px 2px rgba(23,32,31,.04);overflow:hidden}
.gh + .group{margin-top:0}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 14px 8px 16px;position:relative}
.row + .row:before,.rs + .rs:before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--hair)}
.row.noic + .row:before,.rs + .rs:before{left:16px}
.row:active,.rs:active{background:var(--opt)}
.gl{width:24px;height:24px;flex:none;color:var(--green2);stroke-width:1.5}
.row .t{flex:1;font-size:calc(18px*var(--fs));line-height:1.25}
.row .t small{display:block;font-size:calc(14px*var(--fs));color:var(--ink2);font-style:italic;margin-top:1px}
.row .m{font-size:14px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;flex:none;color:var(--chev);stroke-width:2}

/* Bölüm seçici */
.seg{margin:0 16px 18px;min-height:44px;border-radius:12px;background:var(--field);display:flex;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;font-size:calc(14.5px*min(var(--fs),1.1));letter-spacing:-.01em;text-wrap:balance;color:var(--ink2);cursor:pointer;padding:6px 4px;line-height:1.2}
.seg button.on{background:var(--surf);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(23,32,31,.14)}

/* Dua okuma */
.dua{padding:2px 22px 6px;scroll-margin-top:calc(60px + env(safe-area-inset-top))}
.sep{display:flex;align-items:center;gap:12px;color:var(--hair);margin:14px 0 18px}
.sep i{flex:1;border-top:1px solid var(--hair)}
.sep b{font-weight:400;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--goldink)}
.orn{width:16px;height:16px;stroke-width:4.5;flex:none}
.dua .dt{text-align:center;font-size:calc(20px*var(--fs));font-weight:600;color:var(--green);margin-bottom:6px}
.dua .note{text-align:center;font-style:italic;color:var(--goldink);font-size:calc(16px*var(--fs));line-height:1.45;margin:0 2px 8px;text-wrap:balance}
.arb{text-align:center;direction:rtl;margin:4px -6px 0}
.ar{font-family:"Sch",serif;font-size:calc(30px*var(--fa,1));line-height:1.78;white-space:nowrap;unicode-bidi:isolate}
.nk{font-size:72%;position:relative;top:.42em;margin:0 .05em 0 -.15em}
.rule{width:28px;margin:8px auto 12px;border-top:1.5px solid var(--gold)}
.meal{text-align:center}
.tr{font-size:calc(18.5px*var(--fs));line-height:1.4;margin-bottom:.18em;text-wrap:balance}
.tr .g{white-space:nowrap}
html.nobrk .tr{white-space:nowrap}
html.nobrk .tr.brk{white-space:normal}
.src{text-align:center;font-style:italic;color:var(--ink3);font-size:calc(14px*var(--fs));margin-top:12px;text-wrap:balance}
.acts{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.qb{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:24px;background:none;
 color:var(--ink2);font-size:calc(15.5px*min(var(--fs),1.15));cursor:pointer}
.qb svg{width:21px;height:21px}
.qb:active{background:var(--opt)}
.st{stroke-linejoin:miter;stroke-miterlimit:10}.st .d{fill:currentColor;stroke:none}
.qb.on .st .o,#tabs a.on .st .o{fill:currentColor}.qb.on .st .i{stroke:var(--surf)}.qb.on .st .d{fill:var(--surf)}#tabs a.on .st .i{stroke:var(--pill)}#tabs a.on .st .d{fill:var(--pill)}
.qb.on{font-weight:600}
.sub{padding:18px 22px 0;font-size:calc(22px*min(var(--fs),1.12));font-weight:500;font-variation-settings:"opsz" 36;color:var(--green)}
.xref{display:flex;align-items:center;gap:12px;margin:8px 16px 18px;padding:14px 14px 14px 16px;border-radius:16px;background:var(--surf);box-shadow:0 0 0 .5px var(--hair)}
.xref .t{flex:1;font-size:calc(17.5px*var(--fs));line-height:1.3}
.xref .t small{display:block;font-size:calc(14px*var(--fs));color:var(--ink2);font-style:italic;margin-top:2px}
.twin{display:flex;align-items:center;gap:12px;margin:14px 16px 10px;padding:14px 14px 14px 16px;border-radius:16px;background:var(--pill);color:var(--green);font-weight:600;font-size:calc(16.5px*min(var(--fs),1.15))}
.twin span{flex:1}
.pn{display:flex;gap:10px;margin:16px 16px 0}
.pn a{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:68px;padding:10px 14px;border-radius:16px;background:var(--surf);box-shadow:0 0 0 .5px var(--hair)}
.pn a.n{text-align:right}
.pn small{font-size:13px;color:var(--goldink);font-style:italic}
.pn span{font-size:calc(16.5px*min(var(--fs),1.15));line-height:1.25}
.pn a.empty{visibility:hidden}
.alllink{display:block;margin:14px 16px 0;padding:16px;text-align:center;border-radius:16px;background:var(--pill);color:var(--green);font-weight:600;font-size:calc(16.5px*min(var(--fs),1.15))}

/* Sonuç / favori listesi */
.rs{display:block;padding:12px 16px 13px;position:relative}
.rs .k{font-size:calc(13.5px*min(var(--fs),1.15));color:var(--goldink);font-style:italic}
.rs .a{font-family:"Sch",serif;direction:rtl;text-align:right;font-size:calc(22px*var(--fa));line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .m{font-size:calc(17px*var(--fs));line-height:1.4}
mark{background:var(--mark);border-radius:4px;padding:0 2px;color:inherit}

/* Ara */
.sf{position:relative;margin:0 16px 20px}
.sf svg.lup{position:absolute;left:14px;top:50%;margin-top:-11px;width:22px;height:22px;color:var(--ink3);stroke-width:2}
.sf input{width:100%;height:54px;border:0;border-radius:14px;background:var(--field);color:var(--ink);font:inherit;font-size:calc(19px*min(var(--fs),1.15));padding:0 50px 0 46px;outline:none}
.sf input:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.sf input::placeholder{color:var(--ink3)}
.sf button{position:absolute;right:4px;top:3px;width:48px;height:48px;border:0;background:none;color:var(--ink3);border-radius:24px;display:flex;align-items:center;justify-content:center}
.sf button svg{width:20px;height:20px;stroke-width:2}
.sf button.hide{display:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 16px 22px}
.tile{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border:0;border-radius:16px;background:var(--surf);box-shadow:0 0 0 .5px var(--hair);
 font-size:calc(17px*min(var(--fs),1.15));text-align:left;cursor:pointer;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.tile:active{background:var(--opt)}
.empty{margin:36px 30px 0;text-align:center}
.empty .em{position:relative;width:120px;height:120px;margin:0 auto 18px}
.empty .em svg{position:absolute;inset:0;width:120px;height:120px}
.empty .em .o{color:var(--gold);opacity:.55;stroke-width:1.4}
.empty .em .s{width:36px;height:36px;inset:42px;color:var(--green)}
.empty h2{margin:0;font-size:calc(22px*min(var(--fs),1.12));font-weight:500;font-variation-settings:"opsz" 36}
.empty p{font-size:calc(16px*var(--fs));color:var(--ink2);line-height:1.55;margin:8px 0 0}
.chipx{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hair);color:var(--green2);white-space:nowrap}
.chipx svg{width:14px;height:14px;stroke-width:2}

/* Düzenleme (sıralama) */
.er{display:flex;align-items:center;gap:10px;min-height:76px;padding:10px 8px 10px 12px;position:relative;background:var(--surf)}
.er + .er:before{content:"";position:absolute;left:62px;right:0;top:0;border-top:.5px solid var(--hair)}
.pinb{width:44px;height:44px;border-radius:22px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--green2);box-shadow:inset 0 0 0 1px var(--hair);flex:none;cursor:pointer}
.pinb svg{width:19px;height:19px;stroke-width:2}
.pinb:disabled{background:var(--green);color:var(--onbtn);box-shadow:none}
.er .tx{flex:1;min-width:0}
.er .a{font-family:"Sch",serif;direction:rtl;text-align:right;font-size:calc(21px*var(--fa));line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .m{font-size:calc(15px*var(--fs));color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grip{width:48px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none;touch-action:none;cursor:grab}
.grip svg{width:24px;height:24px;stroke-width:2}
.er.lift{z-index:3;border-radius:16px;box-shadow:0 10px 30px rgba(23,32,31,.22);transition:none}
.er.lift:before{display:none}
.er.anim{transition:transform .15s}
.group.edit{overflow:visible}

/* Ayarlar */
.prev{margin:0 16px 22px;padding:18px 16px 14px;border-radius:18px;background:var(--surf);box-shadow:0 0 0 .5px var(--hair)}
.prev .ar{font-size:calc(30px*var(--fa))}
.slr{display:flex;align-items:center;gap:12px;margin-top:14px}
.slr .a1{font-size:14px}.slr .a2{font-size:26px}
.rng{flex:1;-webkit-appearance:none;appearance:none;height:32px;background:none;margin:0;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--green) var(--p),var(--track) var(--p))}
.rng::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--green) var(--p),var(--track) var(--p))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:14px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08)}
.rng::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:14px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ticks{display:flex;justify-content:space-between;margin:0 30px 0 26px;font-size:13px;color:var(--ink3)}
.slab{text-align:center;font-size:14px;color:var(--ink2);margin-top:6px}
.thm{display:flex;gap:12px;padding:14px 14px 12px}
.thm button{flex:1;border:0;background:none;padding:0;text-align:center;font-size:calc(14.5px*min(var(--fs),1.15));color:var(--ink2);cursor:pointer;line-height:1.25}
.thm .ph{display:block;height:86px;border-radius:12px;margin-bottom:8px;box-shadow:0 0 0 1px var(--hair);overflow:hidden;position:relative}
.thm .ph i{position:absolute;height:4px;border-radius:2px}
.thm button.on .ph{box-shadow:0 0 0 2.5px var(--green2)}
.thm button.on{color:var(--ink);font-weight:600}
.tg{width:52px;height:32px;border-radius:16px;background:var(--track);position:relative;flex:none;border:0;cursor:pointer;transition:background .2s}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:28px;height:28px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tg.on{background:var(--green)}
.tg.on:after{left:22px}
.prose{padding:0 22px;font-size:calc(16.5px*var(--fs));line-height:1.6}
.prose p{margin:0 0 14px}
.foot{text-align:center;color:var(--ink3);font-size:13px;margin-top:-4px}
.foot .orn{display:block;margin:0 auto 4px;width:14px;height:14px}

/* Alt sekmeler */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--barbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 box-shadow:0 -.5px 0 var(--hair);display:flex;padding:8px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:62px;color:var(--ink3);font-size:13px;letter-spacing:.005em}
#tabs .ind{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
#tabs svg{width:24px;height:24px;stroke-width:1.6}
#tabs a.on{color:var(--green);font-weight:600}
#tabs a.on .ind{background:var(--pill)}
#tabs a.on svg{stroke-width:2.1}

/* Paylaşma */
.sheet-bg{position:fixed;inset:0;background:rgba(15,20,19,.42);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surf);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 12px}
.sheet h2{margin:0 0 12px;text-align:center;font-size:18px;font-weight:600}
.shprev{display:block;margin:0 auto 6px;max-width:72%;max-height:40vh;border-radius:10px;box-shadow:0 0 0 1px var(--hair),0 8px 24px rgba(0,0,0,.14)}
.shph{height:180px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:0 16px;border:0;border-radius:16px;background:var(--opt);margin-top:10px;font-size:18px;cursor:pointer;text-align:left}
.opt span.ic{width:40px;height:40px;border-radius:12px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--green2)}
.opt svg{width:22px;height:22px}
.opt.cancel{background:none;justify-content:center;color:var(--ink2);min-height:52px}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#143E3B;color:#F6EEDC;
 padding:12px 20px;border-radius:14px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header id="bar">
 <div class="side l" id="bl"></div>
 <button id="title" aria-label="Sayfanın başına dön"></button>
 <div class="side r" id="br"></div>
</header>
<main id="view"></main>

function bindEdit(getKeys, setKeys){

    row.classList.add('lift'); rows.forEach(r => { if (r !== row) r.classList.add('anim'); });

      rows.forEach((r, i) => {

    };

  });

}

  return {id, lines: trl, n: norm(a), meta: norm(b), ln: low(a), lm: low(b)};

    IDX.forEach(r => {
      const N = ' ' + r[kn], Mt = ' ' + r[km];
      if (!ws.every(w => N.includes(' ' + w) || Mt.includes(' ' + w) || r[kn].includes(w))) return;
      const score = ws.reduce((a, w) => a + (Mt.includes(' ' + w) ? 4 : 0) + (N.includes(' ' + w) ? 2 : 0) + (r[kn].includes(w) ? 1 : 0), 0);
      res.push({r, score});
    });
    return res.sort((a, b) => b.score - a.score).map(x => x.r);
  };
  const w1 = low(q).split(/\s+/).filter(w => w.length > 1);
  if (!w1.length) return [];
  const r1 = run(w1, 'ln', 'lm');
  return r1.length ? r1 : run(norm(q).split(/\s+/).filter(w => w.length > 1), 'n', 'meta');
}
function hl(line, ws){
  const n = line.toLocaleLowerCase('tr').length === line.length ? norm(line) : null;
  if (!n) return esc(line);
  const marks = new Array(line.length).fill(false);
  ws.forEach(w => { let i = n.indexOf(w); while (i >= 0){ for (let k = i; k < i + w.length; k++) marks[k] = true; i = n.indexOf(w, i + 1); } });
  let o = '', on = false;
  [...line].forEach((ch, i) => { if (marks[i] !== on){ o += marks[i] ? '<mark>' : '</mark>'; on = marks[i]; } o += esc(ch); });
  return o + (on ? '</mark>' : '');
}

/* ---------- paylaşma ---------- */
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
// Paylaşımda meal, ezber satırlarına bölünmeden düz paragraf olarak gider
const mealPara = d => d.tr.map(t => t.join(' ')).join(' ');
function shareText(id){
  const d = DUA[id];
  return (d.n ? d.n + '\n\n' : '') + d.ar.map(l => l.t).join('\n') + '\n\n' + mealPara(d) + '\n\n(' + d.s + ')';
}
async function doShareText(id){
  const text = shareText(id);
  try{
    if (navigator.share){ await navigator.share({text}); return; }
  }catch(e){ if (e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Dua kopyalandı. İstediğiniz yere yapıştırabilirsiniz.'); }
  catch(e){ toast('Paylaşma bu telefonda açılamadı.'); }
}
function wrap(ctx, text, max){
  const ws = text.split(' '), out = []; let cur = '';
  ws.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > max && cur){ out.push(cur); cur = w; } else cur = t; });
  if (cur) out.push(cur); return out;
}
function bwrap(ctx, text, max){
  // Dengeli bölme: satır sayısı aynı kalacak en dar genişliği bul
  const n = wrap(ctx, text, max).length;
  if (n <= 1) return [text];
  let lo = max / n, hi = max;
  for (let i = 0; i < 18; i++){ const m = (lo + hi) / 2; if (wrap(ctx, text, m).length > n) lo = m; else hi = m; }
  return wrap(ctx, text, hi);
}
function arPieces(l){
  const nk = new Set(l.nk), ws = l.t.split(' '), out = []; let cur = '';
  ws.forEach((w, i) => { cur += (i && cur === '' ? ' ' : (i ? ' ' : '')) + w; if (nk.has(i)){ out.push([cur, false]); out.push(['نِ', true]); cur = ''; } });
  if (cur) out.push([cur, false]);
  return out;
}
const imgCache = {};
async function makeImage(id){
  if (imgCache[id]) return imgCache[id];
  const d = DUA[id], W = 1080, P = 90, max = W - 2 * P;
  await Promise.all([document.fonts.load('60px Sch'), document.fonts.load('40px Lit'), document.fonts.load('italic 34px Lit'), document.fonts.load('600 38px Lit')]);
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const plan = [];
  let y = 150;
  if (d.ti){ ctx.font = '600 38px Lit'; bwrap(ctx, d.ti, max).forEach(l => { plan.push(['h', l, y]); y += 50; }); y += 6; }
  ctx.font = 'italic 34px Lit';
  if (d.n){ bwrap(ctx, d.n, max).forEach(l => { plan.push(['n', l, y]); y += 48; }); y += 24; }
  d.ar.forEach(l => { y += 104; plan.push(['a', l, y]); });
  y += 58; plan.push(['r', '', y]); y += 40;
  ctx.font = '40px Lit';
  bwrap(ctx, mealPara(d), max).forEach(l => { y += 58; plan.push(['t', l, y]); });
  y += 30;
  ctx.font = 'italic 30px Lit';
  bwrap(ctx, '(' + d.s + ')', max).forEach(l => { y += 44; plan.push(['s', l, y]); });
  y += 110;
  c.width = W; c.height = y;
  ctx.fillStyle = '#FBF6EC'; ctx.fillRect(0, 0, W, y);
  ctx.strokeStyle = '#D9C9AD'; ctx.lineWidth = 3; ctx.strokeRect(30, 30, W - 60, y - 60);
  const st = (cx, cy, R) => { ctx.beginPath(); for (let i = 0; i < 16; i++){ const q = i % 2 ? R * .7654 : R, t = (i * 22.5 - 90) * Math.PI / 180; ctx[i ? 'lineTo' : 'moveTo'](cx + q * Math.cos(t), cy + q * Math.sin(t)); } ctx.closePath(); ctx.stroke(); };
  ctx.strokeStyle = '#B48A45'; ctx.lineWidth = 2.5; st(W / 2, 80, 26); st(W / 2, 80, 15);
  ctx.textBaseline = 'alphabetic';
  plan.forEach(([k, t, yy]) => {
    ctx.textAlign = 'center'; ctx.direction = 'ltr';
    if (k === 'h'){ ctx.font = '600 38px Lit'; ctx.fillStyle = '#143E3B'; ctx.fillText(t, W / 2, yy); }
    else if (k === 'n'){ ctx.font = 'italic 34px Lit'; ctx.fillStyle = '#7E5F28'; ctx.fillText(t, W / 2, yy); }
    else if (k === 'a'){
      ctx.fillStyle = '#17201F'; ctx.direction = 'rtl'; ctx.textAlign = 'right';
      const ps = arPieces(t); let f = 60;
      const tw = sz => ps.reduce((a, [x, sm]) => { ctx.font = (sm ? sz * .72 : sz) + 'px Sch'; return a + ctx.measureText(x).width - (sm ? sz * .1 : 0); }, 0);
      let w = tw(f); if (w > max){ f = f * max / w; w = tw(f); }
      let x = W / 2 + w / 2;
      ps.forEach(([x0, sm]) => {
        ctx.font = (sm ? f * .72 : f) + 'px Sch';
        if (sm) x += f * .1;
        ctx.fillText(x0, x, yy + (sm ? f * .3 : 0));
        x -= ctx.measureText(x0).width;
      });
    }
    else if (k === 'r'){ ctx.strokeStyle = '#B48A45'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(W / 2 - 30, yy); ctx.lineTo(W / 2 + 30, yy); ctx.stroke(); }
    else if (k === 't'){ ctx.font = '40px Lit'; ctx.fillStyle = '#17201F'; ctx.fillText(t, W / 2, yy); }
    else if (k === 's'){ ctx.font = 'italic 30px Lit'; ctx.fillStyle = '#6B655B'; ctx.fillText(t, W / 2, yy); }
  });
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  imgCache[id] = blob; return blob;
}
async function doShareImage(id){
  const blob = await makeImage(id);
  const file = new File([blob], 'dua.png', {type: 'image/png'});

let stack = [];
try{ stack = JSON.parse(sessionStorage.getItem('dualar.stack') || '[]'); }catch(e){}

  const h = location.hash.slice(1);

let cur = null, pg = null;
function goBack(){
  if (stack.length > 1) history.back();
  else { const p = pg && pg.back ? pg.back[0] : '#bugun'; stack = [p]; location.replace(p); }
}
function render(same){
  const h = location.hash || '#bugun';

  if (same !== true) sortMode = null;
  if (same === true){}
  else if (stack.length > 1 && stack[stack.length - 2] === h){ stack.pop(); isBack = true; }
  else if (stack[stack.length - 1] !== h) stack.push(h);
  if (stack.length > 60) stack = stack.slice(-60);
  try{ sessionStorage.setItem('dualar.stack', JSON.stringify(stack)); }catch(e){}

  if (!pg){ location.replace('#bugun'); return; }

  document.querySelectorAll('#tabs a').forEach(a => { const on = a.dataset.tab === pg.tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });

  setLock(!!pg.dua);

  else if (isBack && scrolls[h] != null) scrollTo(0, scrolls[h]);

  updateBar();
}
